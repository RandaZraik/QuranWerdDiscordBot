name: Keep Scheduled Workflows Active

on:
  schedule:
    # GitHub disables scheduled workflows after 60 days without repository activity.
    # Check weekly, but only commit after 45 inactive days.
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-scheduled-workflows-active
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Create activity commit when needed
        shell: bash
        run: |
          last_commit_time=$(git log -1 --format=%ct)
          current_time=$(date +%s)
          inactive_days=$(( (current_time - last_commit_time) / 86400 ))

          echo "Repository has been inactive for ${inactive_days} days."
          if (( inactive_days < 45 )); then
            echo "No keepalive commit is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
