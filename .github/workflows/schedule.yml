name: Daily Quran Werd Bot Run

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install Dependencies
        run: npm ci --omit=dev --omit=optional --no-audit

      - name: Create Firebase Service Account File
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json

      - name: Run Bot
        run: npm start
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          PAGES_PER_POST: ${{ secrets.PAGES_PER_POST }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          RUN_ONCE: true
          QURAN_MODE: ${{ secrets.QURAN_MODE }}

      - name: Remove Firebase Service Account File
        if: always()
        run: rm -f firebase-service-account.json
